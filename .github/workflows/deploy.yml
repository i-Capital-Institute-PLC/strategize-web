name: Deploy to Server

on:
  push:
    branches:
      - main
      - new-update

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t strategize-web:latest \
            --build-arg NEXT_PUBLIC_DOMAIN=strategize.icapitalafrica.org \
            --build-arg NEXT_PUBLIC_API_URL=https://strategize-api.frontiertech.org \
            --build-arg NEXT_PUBLIC_GRAPHQL_URL=https://strategize-api.frontiertech.org/graphql \
            --build-arg NEXT_PUBLIC_GRAPHQL_ENDPOINT=/api/graphql \
            --build-arg NEXT_PUBLIC_API=https://strategize-api.frontiertech.org/graphql \
            --build-arg NEXT_PUBLIC_DATA=https://strategize-api.frontiertech.org \
            --build-arg NEXT_PUBLIC_SOCKET=wss://strategize-api.frontiertech.org/graphql \
            --build-arg API_BASE_URL=https://strategize-api.frontiertech.org \
            .

      - name: Stop and Remove Old Containers
        run: |
          CONTAINERS=$(docker ps -a -q --filter name=strategize-web)
          if [ -n "$CONTAINERS" ]; then
            docker stop $CONTAINERS || true
            docker rm $CONTAINERS || true
          fi

      - name: Remove dangling images
        run: |
          docker images -q --filter "dangling=true" | xargs -r docker rmi -f || true

      - name: Run New Container
        run: |
          sudo fuser -k 4410/tcp || true
          CPU_LIMIT=$(awk "BEGIN { printf \"%.2f\", $(nproc) * 0.5 }")
          echo "Limiting container CPU to ${CPU_LIMIT} cores (50% of $(nproc) host cores)"
          docker run -d \
            --name strategize-web \
            --restart unless-stopped \
            --network host \
            --cpus="${CPU_LIMIT}" \
            strategize-web:latest

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4410 >/dev/null; then
              echo "strategize-web is up on :4410"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          docker logs strategize-web --tail 100 || true
          exit 1

      - name: Cleanup Docker system
        if: success()
        run: |
          docker system prune -af
